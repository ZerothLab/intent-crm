name: intent-crm
services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intent_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intent_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-intent_crm}
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["intent-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  intent-postgres:
    # Create once for a new install; an existing installation must select its real volume.
    # External volumes fail closed on a typo instead of silently creating an empty database.
    name: ${INTENT_POSTGRES_VOLUME:-intent-crm_intent-postgres}
    external: true
